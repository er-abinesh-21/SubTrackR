<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1B1717" />
    <meta name="description" content="See what you pay for every subscription, and what renews next." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SubTrackR</title>
    <script>
      // Apply the saved theme before first paint so a reload never flashes the wrong one. Dark is the default.
      (function () {
        var theme = "dark";
        try {
          if (localStorage.getItem("subtrackr-theme") === "light") theme = "light";
        } catch (e) {}
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.classList.toggle("dark", theme === "dark");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#EDEBDD" : "#1B1717");
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
